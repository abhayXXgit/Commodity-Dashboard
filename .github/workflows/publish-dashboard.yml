name: Build and publish the dashboard

# Rebuilds the offline dashboard every morning and publishes it to GitHub Pages,
# so the URL you give people always serves a build made that day rather than a
# file someone emailed weeks ago.
#
# What is genuinely fresh on each run:
#   - exchange rates (fetched live from a public API during the build)
#   - the build date and every date-relative figure
#   - any producer circular committed to data/imports/
#
# What is NOT fresh: LME copper. That data is licensed and cannot be fetched
# from a public runner. Those series stay labelled DEMO_DATA and the dashboard
# says so on every page.

on:
  schedule:
    - cron: "0 1 * * *"        # 01:00 UTC = 06:30 IST, daily
  push:
    branches: [main]
  workflow_dispatch:            # lets you rebuild on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the database and seed the demo series
        env:
          DATA_MODE: DEMO
          ENABLE_SCHEDULER: "false"
          BOOTSTRAP_FORECASTS: "false"
        run: python backend/main.py --seed --no-serve

      - name: Fetch live exchange rates and ingest any committed circulars
        env:
          FX_API_URL: https://open.er-api.com/v6/latest
          FALLBACK_USDINR: "95.12"
          FALLBACK_EURINR: "110.66"
          ENABLE_SCHEDULER: "false"
        run: |
          python - <<'PY'
          from backend.services.etl import daily_job
          out = daily_job()
          print("FX:", out["fx"]["status"])
          for r in out["fx"]["rates"]:
              print(f"   {r['pair']} = {r['rate']}  [{r['class']}]")
          for s in out["prices"]["sources"]:
              print(f"   {s['adapter']:22s} {s['status']:12s} inserted={s['inserted']}")
          print("alerts raised:", out["alerts"]["count"])
          PY

      # Back-testing twelve models across nine series takes ~2.5 minutes with
      # folds=2 (measured), so the cap below is generous even on a slow runner.
      # It is kept, along with the priority ordering, as cheap insurance: if a
      # model ever hangs, the dashboard degrades to "no forecast stored" for the
      # series it did not reach - honest and still useful - rather than the whole
      # publish failing and leaving yesterday's page up with no explanation.
      - name: Train the forecast models
        continue-on-error: true
        timeout-minutes: 12
        env:
          ENABLE_SCHEDULER: "false"
        run: |
          python - <<'PY'
          from backend.services.forecast_service import refresh_forecasts, DEFAULT_SERIES

          # Headline series first, so a timeout costs the least important ones.
          priority = ["CU|BME|CU_CATHODE", "AL|NALCO|AL_INGOT", "CU|LME|CU_CATHODE",
                      "AL|NALCO|AL_WIREROD"]
          ordered = sorted(
              DEFAULT_SERIES,
              key=lambda s: priority.index(f"{s[0]}|{s[1]}|{s[2]}")
              if f"{s[0]}|{s[1]}|{s[2]}" in priority else 99)

          out = refresh_forecasts(series=ordered, folds=2)
          print(f"{len(out['succeeded'])} series trained, {len(out['failed'])} failed")
          for f in out["failed"]:
              print("   FAILED:", f)
          PY

      - name: Build the single-file dashboard
        run: |
          python -m backend.services.build_standalone
          python - <<'PY'
          # Refuse to publish something broken or empty.
          import base64, json, re, pathlib
          h = pathlib.Path("frontend/standalone.html").read_text(encoding="utf-8")
          assert len(h) > 500_000, f"standalone.html is only {len(h)} bytes"
          m = re.search(r'type="application/base64">([^<]+)<', h)
          assert m, "no data payload embedded"
          d = json.loads(base64.b64decode(m.group(1)))
          assert d["series"], "no price series in the payload"
          assert d["rollup"]["transformers"], "no transformer projects in the payload"
          assert h.count('script src="http') == 0, "page depends on an external script"
          print(f"  ok: {len(h)/1e6:.2f} MB, {len(d['series'])} series, "
                f"{len(d['rollup']['transformers'])} projects, "
                f"USD/INR {d['parity']['usdinr']}")
          PY

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp frontend/standalone.html _site/index.html
          cp frontend/standalone.html "_site/dashboard-$(date +%Y-%m-%d).html"
          ls -lh _site
          echo "Built $(date -u +'%Y-%m-%d %H:%M UTC')"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
